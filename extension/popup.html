<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1e293b;
      color: #e2e8f0;
      padding: 16px;
      margin: 0;
    }
    h2 {
      font-size: 14px;
      margin: 0 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p {
      font-size: 12px;
      color: #94a3b8;
      margin: 0 0 12px;
      line-height: 1.4;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    button:disabled { background: #475569; cursor: not-allowed; }
    #status {
      font-size: 12px;
      margin-top: 8px;
      padding: 6px;
      border-radius: 4px;
      display: none;
    }
    .success { background: #14532d; color: #86efac; }
    .error { background: #450a0a; color: #fca5a5; }
    .info { background: #1e3a5f; color: #93c5fd; }
  </style>
</head>
<body>
  <h2>🛡️ Alberta Health MCP</h2>
  <p>If auto-capture didn't work, sign in at
    <a href="https://myhealthrecords.alberta.ca" target="_blank"
       style="color:#93c5fd">Alberta Health Records</a>
    first, then click below.</p>
  <button id="captureBtn">Capture &amp; Send Cookies</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
