name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install portal types used by privacy regression tests
        run: npm ci --prefix portal --ignore-scripts --no-audit --no-fund

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit shipped runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Build TypeScript
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Regression tests
        run: npm test

      - name: Validate and pack installer
        run: |
          npm install -g @anthropic-ai/mcpb@2.1.2
          mcpb validate manifest.json
          mcpb pack . ab-health-mcp.mcpb

      - name: Verify packaged runtime
        run: npm run test:bundle -- ab-health-mcp.mcpb

      - name: Check release version before publishing
        id: release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { isNewerVersion, isValidVersion } from './build/utils/version.js';
          const candidate = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const response = await fetch('https://www.myaihealth.ca/version.json', { signal: AbortSignal.timeout(30000) });
          if (!response.ok) throw new Error(`Published-version check failed: HTTP ${response.status}`);
          const { version } = await response.json();
          if (!isValidVersion(candidate) || !isValidVersion(version)) {
            throw new Error('Invalid published version; refusing to overwrite the installer.');
          }
          const publish = isNewerVersion(candidate, version);
          console.log(`Candidate ${candidate}; published ${version}; publish=${publish}.`);
          appendFileSync(process.env.GITHUB_OUTPUT, `publish=${publish}\n`);
          NODE

      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.release.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            build/
            static/styles.css
            ab-health-mcp.mcpb
          retention-days: 1

  runtime-audit:
    name: Runtime audit (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: api
            node: 22
          - directory: portal
            node: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --prefix "${{ matrix.directory }}" --ignore-scripts --no-audit --no-fund
      - run: npm audit --prefix "${{ matrix.directory }}" --omit=dev --audit-level=high
      - name: Check disabled portal
        if: matrix.directory == 'portal'
        env:
          PORTAL_DEPLOY_ENABLED: 'false'
          PORTAL_TELEMETRY_ENABLED: 'false'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm run lint --prefix portal
          npm run build --prefix portal

  deploy:
    name: Deploy
    needs: [build, runtime-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build

      - name: Upload .mcpb to Azure Blob Storage
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az storage blob upload \
              --account-name myaihealthdownloads \
              --container-name downloads \
              --name ab-health-mcp.mcpb \
              --file ab-health-mcp.mcpb \
              --overwrite \
              --only-show-errors --output none \
              --connection-string "${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}"
            az storage blob upload \
              --account-name myaihealthdownloads \
              --container-name downloads \
              --name version.json \
              --file static/version.json \
              --content-type application/json \
              --overwrite \
              --only-show-errors --output none \
              --connection-string "${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}"

      - name: Deploy website to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: static
          api_location: api
          skip_app_build: true
          skip_api_build: false

  deploy-portal:
    name: Deploy Portal
    needs: [build, runtime-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.PORTAL_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push portal image
        uses: azure/cli@v2
        with:
          inlineScript: |
            az acr build \
              --registry abhealthmcpacr \
              --image ab-health-portal:${{ github.sha }} \
              --image ab-health-portal:latest \
              --file portal/Dockerfile \
              .

      - name: Deploy to Container App
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ab-health-portal \
              --resource-group ab-health-mcp \
              --image abhealthmcpacr.azurecr.io/ab-health-portal:${{ github.sha }}
